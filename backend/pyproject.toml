[project]
name = "text-mql"
version = "0.1.0"
description = "MongoDB Text-to-MQL API - Query MongoDB databases using natural language"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.3.27",
    "langchain-community>=0.3.31",
    "langchain-mongodb>=0.7.2",
    "langchain-openai>=0.3.35",
    "pymongo>=4.15.4",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]
